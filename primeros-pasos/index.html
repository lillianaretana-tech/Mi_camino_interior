<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7eff3"><title>Mi Camino Interior · Descubrirme</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#493746;background:#faf6f5}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:20px 17px 65px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:14px;font-weight:750;color:#73536d}.pill{font-size:12px;background:#f0e3ed;border-radius:20px;padding:8px 12px;color:#704c68}.panel{background:#fff;border:1px solid #ebdce6;border-radius:24px;padding:25px 21px;box-shadow:0 7px 24px #5b36530b;margin-top:20px}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.09em;color:#916d8c;text-transform:uppercase}h1{font-size:clamp(28px,7vw,40px);line-height:1.16;margin:16px 0}p{line-height:1.65;font-size:17px}.muted{color:#786b77}.question{border-top:1px solid #eee2e9;padding-top:19px;margin-top:22px}h2{font-size:21px;line-height:1.4}textarea{display:block;width:100%;min-height:105px;border:1px solid #d9c6d3;border-radius:13px;padding:14px;font:inherit;font-size:16px;resize:vertical;background:#fffcfe;color:#493746}button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:13px 17px;font-weight:700}.primary{background:#76536e;color:white}.secondary{background:#f2e8ef;color:#694b63}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:19px}.actions button{flex:1}button:disabled{opacity:.45;cursor:default}.progress{height:9px;border-radius:20px;background:#f1e8ee;overflow:hidden;margin-top:15px}.bar{height:100%;background:#b58ca8;transition:width .2s}.tip{background:#f9f1f5;border-radius:16px;padding:17px;margin-top:22px}.small{font-size:13px}.footer{text-align:center;margin-top:22px;color:#827381;font-size:13px}a{color:#76536e}.hidden{display:none}button:focus-visible,textarea:focus-visible{outline:3px solid #b78baa;outline-offset:3px}
</style></head><body><main><header class="top"><div class="brand">🦋 Mi Camino Interior</div><span class="pill">🌱 Nivel 1 · Descubrirme</span></header><div class="progress"><div class="bar" id="bar"></div></div><div id="app"></div><footer class="footer">Un espacio para conocerte, sin exámenes ni respuestas correctas.<p class="small"><a href="../">Volver al libro original</a></p></footer></main><script>
const lessons=[["¿Estás viviendo o solamente cumpliendo?","Entre trabajo, cuentas y responsabilidades, los días pueden pasar sin que nos preguntemos si estamos viviendo como queremos.","¿Qué parte de tu día hacés por elección y cuál por pura costumbre?","Si pudieras cambiar una sola cosa de tu rutina, ¿qué sería y por qué?","Mañana buscá diez minutos para hacer algo que elegiste vos, no por obligación."],["¿Por qué reaccionás así?","A veces alguien dice una frase pequeña y nos enojamos muchísimo. Tal vez la frase fue solo la última gota.","¿Qué situación te hace perder la paciencia más rápido?","Cuando reaccionás así, ¿qué creés que necesitabas y no supiste decir?","La próxima vez que te molestés, esperá unos segundos antes de responder y observá qué sentís."],["¿A quién querés complacer?","Decir que sí puede ser más fácil que explicar lo que realmente queremos. Pero decir que sí a todo también tiene un costo.","¿Cuándo fue la última vez que dijiste que sí queriendo decir que no?","¿Qué temés que pase si expresás lo que de verdad querés?","Notá una ocasión en la que puedas expresar tu preferencia con respeto."],["¿Cómo tratás a quienes más querés?","A veces somos amables con desconocidos y perdemos la paciencia con quienes comparten nuestra vida.","¿Con quién te cuesta más tener paciencia?","¿Cómo se sentiría esa persona si la trataras con la misma atención que ofrecés a una visita?","Elegí un gesto pequeño de escucha o amabilidad y hacelo hoy."],["¿Qué historia te contás sobre vos?","Hay frases que repetimos durante años: «yo soy así», «no puedo», «siempre me sale mal». A veces terminamos creyéndolas sin revisarlas.","¿Qué frase negativa repetís sobre vos?","¿Quién te enseñó esa idea y qué pruebas tenés de que siempre sea cierta?","Cuando aparezca esa frase, probá cambiar «soy así» por «hasta ahora me ha costado»."],["¿Qué te cuesta reconocer?","Equivocarse es parte de vivir. Lo difícil puede ser admitirlo sin buscar una excusa o alguien a quien culpar.","¿Cuándo fue la última vez que te costó aceptar un error?","¿Qué pensás que perderías si dijeras simplemente «me equivoqué»?","Observá una equivocación pequeña y reconocela sin castigarte."],["¿Qué querés hacer diferente?","No necesitás transformar toda tu vida de golpe. A veces un cambio empieza con una decisión muy pequeña.","¿Qué descubriste de vos durante estas conversaciones?","¿Qué hábito o reacción querés empezar a cambiar, aunque sea poco a poco?","Elegí una acción concreta para esta semana. Que sea tan pequeña que realmente puedas hacerla."]];
const KEY="mi-camino-descubrirme-v1";
let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){state={}};state.answers=state.answers||{};state.done=state.done||{};let current=lessons.findIndex((_,i)=>!state.done[i]);if(current<0)current=0;let speaking=false;
const app=document.getElementById("app");function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){document.getElementById("saved").textContent="No se pudo guardar en este dispositivo"}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function stop(){if("speechSynthesis" in window) speechSynthesis.cancel();speaking=false}
function speak(){if(!("speechSynthesis" in window)){alert("Este navegador no permite leer en voz alta.");return}if(speaking){stop();render();return}let l=lessons[current];let u=new SpeechSynthesisUtterance([l[0],l[1],l[2],l[3],l[4]].join(". "));u.lang="es-CR";u.rate=.92;u.onend=()=>{speaking=false;const b=document.getElementById("audio");if(b)b.textContent="🔊 Escuchar conversación"};u.onerror=()=>{speaking=false};speaking=true;speechSynthesis.speak(u);document.getElementById("audio").textContent="⏹ Detener audio"}
function open(i){stop();current=Math.max(0,Math.min(i,lessons.length-1));render();scrollTo({top:0,behavior:"smooth"})}
function complete(){state.done[current]=true;save();render();scrollTo({top:0,behavior:"smooth"})}
function render(){const l=lessons[current];const n=Object.values(state.done).filter(Boolean).length;document.getElementById("bar").style.width=(n/lessons.length*100)+"%";app.innerHTML=`<section class="panel"><div class="top"><span class="eyebrow">Conversación ${current+1} de ${lessons.length}</span><span class="pill">${state.done[current]?"✓ Completada":"2 preguntas · a tu ritmo"}</span></div><h1>${esc(l[0])}</h1><p>${esc(l[1])}</p><button id="audio" class="secondary" onclick="speak()">🔊 Escuchar conversación</button><div class="question"><div class="eyebrow">Primera pregunta incómoda</div><h2>${esc(l[2])}</h2><textarea id="a0" aria-label="Tu reflexión a la primera pregunta" placeholder="Escribí lo que pensás, aunque sea una frase...">${esc(state.answers[current+"_0"]||"")}</textarea></div><div class="question"><div class="eyebrow">Segunda pregunta incómoda</div><h2>${esc(l[3])}</h2><textarea id="a1" aria-label="Tu reflexión a la segunda pregunta" placeholder="No hay una respuesta correcta...">${esc(state.answers[current+"_1"]||"")}</textarea></div><div class="tip"><strong>🌿 Algo para llevarte hoy</strong><p>${esc(l[4])}</p></div><p class="muted small" id="saved">Tus respuestas se guardan en este dispositivo. Podés dejarlas pendientes.</p><div class="actions"><button class="secondary" onclick="open(current-1)" ${current===0?"disabled":""}>← Anterior</button><button class="primary" onclick="${state.done[current]&&current<lessons.length-1?"open(current+1)":"complete()"}">${state.done[current]?(current===lessons.length-1?"✓ Recorrido completado":"Continuar →"):"✓ Terminé por hoy"}</button></div>${state.done[current]&&current===lessons.length-1?'<p class="tip">🦋 Terminaste estas siete conversaciones. No se trata de llegar primero, sino de descubrir algo sobre vos. Podés volver a cualquiera cuando quieras.</p>':""}</section><div class="actions"><button class="secondary" onclick="document.getElementById('indice').classList.toggle('hidden')">☰ Ver mis conversaciones</button></div><section class="panel hidden" id="indice"><h2>Mi recorrido</h2><div id="items"></div></section>`;for(let i=0;i<2;i++){document.getElementById("a"+i).addEventListener("input",e=>{state.answers[current+"_"+i]=e.target.value;save();document.getElementById("saved").textContent="✓ Guardado en este dispositivo"})}document.getElementById("items").innerHTML=lessons.map((x,i)=>`<p><button class="secondary" onclick="open(${i})">${state.done[i]?"✓ ":""}${i+1}. ${esc(x[0])}</button></p>`).join("")}
render();
</script></body></html>
