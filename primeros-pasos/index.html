<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7eff3"><title>Mi Camino Interior · Descubrirme</title><style>
:root{color-scheme:light;--ink:#493b43;--muted:#796b73;--border:#e8d9d5;--accent:#845c79}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f8ede6,#f2e9f4 53%,#f7ece6);font:15px/1.65 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);min-height:100vh}button,textarea{font:inherit}button{cursor:pointer}main{max-width:790px;margin:auto;padding:22px 16px 65px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font:normal 22px Georgia,serif;color:#62485c}.pill{font-size:12px;background:#fffaf8;border:1px solid var(--border);border-radius:30px;padding:7px 12px;color:#76536e}.hero{position:relative;overflow:hidden;background:radial-gradient(circle at 85% 10%,#f7d9d7 0,transparent 40%),linear-gradient(135deg,#fffaf4,#f1e5ef);border:1px solid #ead7d9;border-radius:25px;padding:25px 28px;box-shadow:0 12px 40px #684b5c12;margin-top:18px}.hero h1{font:normal 30px/1.25 Georgia,serif;color:#62485c;margin:6px 0}.hero p{font-size:14px;margin:7px 0;color:#786879}.butterfly{position:absolute;right:23px;top:14px;font-size:52px;opacity:.3}.panel{background:#fffaf9e8;border:1px solid var(--border);border-radius:20px;padding:25px 27px;box-shadow:0 5px 18px #6648590b;margin-top:17px}.eyebrow{font-size:11px;letter-spacing:.13em;font-weight:800;color:#a06d7a;text-transform:uppercase}h1{font:normal clamp(24px,4vw,31px)/1.3 Georgia,serif;color:#62485c;margin:11px 0}h2{font:normal 21px/1.4 Georgia,serif;color:#62485c;margin:9px 0 14px}p{font-size:15px;line-height:1.75}.muted{color:var(--muted)}.question{margin-top:19px;padding:19px;background:#f4eaf0;border-radius:15px}.question h2{font-size:20px}.question textarea{display:block;width:100%;min-height:92px;border:1px solid #d9c4cc;border-radius:12px;background:#fffdfb;padding:12px;color:var(--ink);resize:vertical;font-size:15px}.question textarea:focus{outline:2px solid #c6a7c1}button{border:0;border-radius:13px;padding:10px 15px;font-weight:650;font-size:14px}.primary{background:#805b78;color:#fff}.secondary{background:#f2e3e8;color:#6d4c63}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:17px}.actions button{flex:1}button:disabled{opacity:.45;cursor:default}.progress{height:7px;border-radius:20px;background:#ecdfdf;overflow:hidden;margin-top:15px}.bar{height:100%;background:linear-gradient(90deg,#bc8a87,#9475a5);transition:width .2s}.tip{border-left:3px solid #c797a3;background:#fbf0ef;border-radius:0 13px 13px 0;padding:14px 17px;margin-top:18px}.tip p{margin:6px 0}.small{font-size:12px}.footer{text-align:center;margin-top:24px;color:#827381;font-size:12px}.footer a{color:#76536e}.hidden{display:none}button:focus-visible,textarea:focus-visible{outline:3px solid #b78baa;outline-offset:3px}@media(max-width:520px){main{padding:14px 12px 45px}.hero{padding:20px}.hero h1{font-size:25px}.panel{padding:19px 16px}.brand{font-size:19px}.butterfly{font-size:39px;right:12px}.question{padding:15px}h1{font-size:25px}}
</style></head><body><main><header class="top"><div class="brand">🦋 Mi Camino Interior</div><span class="pill">🌱 Nivel 1 · Descubrirme</span></header><section class="hero"><span class="eyebrow">Un momento para vos</span><h1>Dos preguntas que quizá nunca te hiciste</h1><p>Sin exámenes. Sin juicios. A tu ritmo.</p><span class="butterfly" aria-hidden="true">🦋</span></section><div class="progress"><div class="bar" id="bar"></div></div><div id="app"></div><footer class="footer">Un espacio para conocerte, sin exámenes ni respuestas correctas.<p class="small"><a href="../">Volver al libro original</a></p></footer></main><script>
const lessons=[["¿Estás viviendo o solamente cumpliendo?","Entre trabajo, cuentas y responsabilidades, los días pueden pasar sin que nos preguntemos si estamos viviendo como queremos.","¿Qué parte de tu día hacés por elección y cuál por pura costumbre?","Si pudieras cambiar una sola cosa de tu rutina, ¿qué sería y por qué?","Mañana buscá diez minutos para hacer algo que elegiste vos, no por obligación."],["¿Por qué reaccionás así?","A veces alguien dice una frase pequeña y nos enojamos muchísimo. Tal vez la frase fue solo la última gota.","¿Qué situación te hace perder la paciencia más rápido?","Cuando reaccionás así, ¿qué creés que necesitabas y no supiste decir?","La próxima vez que te molestés, esperá unos segundos antes de responder y observá qué sentís."],["¿A quién querés complacer?","Decir que sí puede ser más fácil que explicar lo que realmente queremos. Pero decir que sí a todo también tiene un costo.","¿Cuándo fue la última vez que dijiste que sí queriendo decir que no?","¿Qué temés que pase si expresás lo que de verdad querés?","Notá una ocasión en la que puedas expresar tu preferencia con respeto."],["¿Cómo tratás a quienes más querés?","A veces somos amables con desconocidos y perdemos la paciencia con quienes comparten nuestra vida.","¿Con quién te cuesta más tener paciencia?","¿Cómo se sentiría esa persona si la trataras con la misma atención que ofrecés a una visita?","Elegí un gesto pequeño de escucha o amabilidad y hacelo hoy."],["¿Qué historia te contás sobre vos?","Hay frases que repetimos durante años: «yo soy así», «no puedo», «siempre me sale mal». A veces terminamos creyéndolas sin revisarlas.","¿Qué frase negativa repetís sobre vos?","¿Quién te enseñó esa idea y qué pruebas tenés de que siempre sea cierta?","Cuando aparezca esa frase, probá cambiar «soy así» por «hasta ahora me ha costado»."],["¿Qué te cuesta reconocer?","Equivocarse es parte de vivir. Lo difícil puede ser admitirlo sin buscar una excusa o alguien a quien culpar.","¿Cuándo fue la última vez que te costó aceptar un error?","¿Qué pensás que perderías si dijeras simplemente «me equivoqué»?","Observá una equivocación pequeña y reconocela sin castigarte."],["¿Qué querés hacer diferente?","No necesitás transformar toda tu vida de golpe. A veces un cambio empieza con una decisión muy pequeña.","¿Qué descubriste de vos durante estas conversaciones?","¿Qué hábito o reacción querés empezar a cambiar, aunque sea poco a poco?","Elegí una acción concreta para esta semana. Que sea tan pequeña que realmente puedas hacerla."]];
const KEY="mi-camino-descubrirme-v1";
let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){state={}};state.answers=state.answers||{};state.done=state.done||{};let current=lessons.findIndex((_,i)=>!state.done[i]);if(current<0)current=0;let speaking=false;let step=0;
const app=document.getElementById("app");function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){const el=document.getElementById("saved");if(el)el.textContent="No se pudo guardar en este dispositivo"}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function stop(){if("speechSynthesis" in window) speechSynthesis.cancel();speaking=false}
function speak(){if(!("speechSynthesis" in window)){alert("Este navegador no permite leer en voz alta.");return}if(speaking){stop();render();return}let l=lessons[current];let u=new SpeechSynthesisUtterance([l[0],l[1],l[2],l[3],l[4]].join(". "));u.lang="es-CR";u.rate=.92;u.onend=()=>{speaking=false;const b=document.getElementById("audio");if(b)b.textContent="🔊 Escuchar conversación"};u.onerror=()=>{speaking=false};speaking=true;speechSynthesis.speak(u);document.getElementById("audio").textContent="⏹ Detener audio"}
function goToLesson(i){stop();step=0;current=Math.max(0,Math.min(i,lessons.length-1));render();window.scrollTo(0,0)}
function complete(){stop();state.done[current]=true;save();if(current<lessons.length-1){goToLesson(current+1)}else{render();window.scrollTo(0,0)}}
function nextStep(){stop();step=1;render();window.scrollTo(0,0)}
function render(){const l=lessons[current];const n=Object.values(state.done).filter(Boolean).length;document.getElementById("bar").style.width=(n/lessons.length*100)+"%";const q=step===0?0:1;app.innerHTML=`<section class="panel"><div class="top"><span class="eyebrow">Conversación ${current+1} de ${lessons.length}</span><span class="pill">${state.done[current]?"✓ Completada":"🌱 Descubrirme"}</span></div><h1>${esc(l[0])}</h1><p>${esc(l[1])}</p><button id="audio" class="secondary" onclick="speak()">🔊 Escuchar conversación</button><div class="question"><div class="eyebrow">${q===0?"Primera":"Segunda"} pregunta incómoda</div><h2>${esc(l[2+q])}</h2><textarea id="answer" aria-label="Tu reflexión" placeholder="Podés escribir una frase o dejarla para después...">${esc(state.answers[current+"_"+q]||"")}</textarea></div>${q===1?`<div class="tip"><strong>🌿 Algo para llevarte hoy</strong><p>${esc(l[4])}</p></div>`:""}<p class="muted small" id="saved">Tus respuestas se guardan en este dispositivo. No tenés que responder todo.</p><div class="actions"><button class="secondary" onclick="${q===1?"step=0;render()":"goToLesson(current-1)"}" ${q===0&&current===0?"disabled":""}>← ${q===1?"Pregunta anterior":"Conversación anterior"}</button><button class="primary" onclick="${q===0?"nextStep()":"complete()"}">${q===0?"Segunda pregunta →":state.done[current]?(current===lessons.length-1?"✓ Recorrido completado":"Continuar →"):"✓ Completar y continuar →"}</button></div>${state.done[current]&&current===lessons.length-1&&q===1?'<div class="tip">🦋 Terminaste las siete conversaciones. Podés volver cuando quieras.</div>':""}</section><div class="actions"><button class="secondary" onclick="document.getElementById('indice').classList.toggle('hidden')">☰ Ver mis conversaciones</button></div><section class="panel hidden" id="indice"><h2>Mi recorrido</h2><div id="items"></div></section>`;document.getElementById("answer").addEventListener("input",e=>{state.answers[current+"_"+q]=e.target.value;save();document.getElementById("saved").textContent="✓ Guardado en este dispositivo"});document.getElementById("items").innerHTML=lessons.map((x,i)=>`<p><button class="secondary" onclick="goToLesson(${i})">${state.done[i]?"✓ ":""}${i+1}. ${esc(x[0])}</button></p>`).join("")}

render();
</script></body></html>
